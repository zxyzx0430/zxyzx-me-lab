name: React M01 preview checks
on:
  push:
    branches: [feat/react-m01-poster-architecture]
    paths:
      - 'apps/portfolio-react/**'
      - '.github/workflows/react-m01-preview-check.yml'
  pull_request:
    paths:
      - 'apps/portfolio-react/**'
      - '.github/workflows/react-m01-preview-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portfolio-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python visual/compare.py
      - run: node ../../scripts/validate-modules.mjs
